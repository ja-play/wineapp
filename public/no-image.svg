<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA1628" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#BA1628" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="190" r="110" fill="#BA1628" fill-opacity="0.03"/>

  <!-- Decorative Outer Circle -->
  <circle cx="200" cy="180" r="82" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Inner Badge Circle -->
  <circle cx="200" cy="180" r="72" fill="url(#bottleGrad)" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Wine Bottle & Glass Graphic -->
  <g transform="translate(200, 180)">
    <!-- Wine Bottle -->
    <path d="M-8,32 
             L-8,-10 
             C-8,-18 -4,-24 -4,-34 
             L-4,-48 
             L4,-48 
             L4,-34 
             C4,-24 8,-18 8,-10 
             L8,32 
             Z" 
          fill="none" 
          stroke="#475569" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
    
    <!-- Bottle Cap / Foil -->
    <path d="M-5,-44 L5,-44 L5,-50 L-5,-50 Z" fill="#BA1628"/>
    <line x1="-5" y1="-38" x2="5" y2="-38" stroke="#BA1628" stroke-width="1.5"/>

    <!-- Bottle Label -->
    <rect x="-6" y="2" width="12" height="18" rx="1" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <line x1="-3" y1="7" x2="3" y2="7" stroke="#BA1628" stroke-width="1"/>
    <line x1="-4" y1="11" x2="4" y2="11" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="-4" y1="14" x2="4" y2="14" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Wine Glass -->
    <path d="M12,12 
             C12,24 22,24 22,12 
             Z" 
          fill="#BA1628" 
          fill-opacity="0.2" 
          stroke="#475569" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    <!-- Glass Stem & Base -->
    <line x1="17" y1="23" x2="17" y2="32" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="22" y2="32" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Subtle camera/photo slash icon badge at corner -->
    <circle cx="28" cy="-24" r="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <g transform="translate(28, -24) scale(0.65)">
      <!-- Mini camera icon -->
      <path d="M-9,-4 L-6,-7 L6,-7 L9,-4 L11,-4 C12,-4 13,-3 13,-2 L13,7 C13,8 12,9 11,9 L-11,9 C-12,9 -13,8 -13,7 L-13,-2 C-13,-3 -12,-4 -11,-4 Z" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="2.5" r="3.5" fill="none" stroke="#64748B" stroke-width="2"/>
      <!-- Diagonal slash -->
      <line x1="-12" y1="-8" x2="12" y2="10" stroke="#BA1628" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="325" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="1.5" 
        fill="#334155">IMAGE NOT AVAILABLE</text>

  <text x="200" y="350" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="12" 
        font-weight="500" 
        letter-spacing="0.3" 
        fill="#64748B">Picture coming soon</text>

  <!-- Subtle bottom branding accent -->
  <rect x="180" y="375" width="40" height="2" rx="1" fill="#BA1628" fill-opacity="0.3"/>
</svg>
